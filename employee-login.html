<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARIF SYSTEM - Employee Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #1e3a8a;
            --accent: #10b981;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .brand-logo i {
            font-size: 45px;
        }

        .brand-logo h2 {
            margin: 10px 0 5px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-logo p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #1e40af;
        }

        .btn-login:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-home a:hover {
            color: var(--primary);
        }

        /* Message Box */
        .status-msg {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .status-msg.success {
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            display: flex;
        }
        .status-msg.error {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            display: flex;
        }
        
        .footer-credit {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="brand-logo">
                <i class="fa-solid fa-building-shield"></i>
                <h2>IGI SYSTEM</h2>
                <p>Sign in to access your dashboard</p>
            </div>

            <div id="statusMessage" class="status-msg"></div>

            <form id="loginForm" onsubmit="handleEmployeeLogin(event)">
                
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="empEmail" class="form-control" placeholder="example@gmail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="empPassword" class="form-control" placeholder="••••••" required>
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </form>

            <div class="back-home">
                <a href="./index.html"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a>
            </div>
            
            <div class="footer-credit">
                © 2026 IGI System. All Rights Reserved.
            </div>

        </div>
    </div>

    <script>
        // সুপাবেস ক্রেডেনশিয়ালস
        const SUPABASE_URL = "https://vkwxheddyagpjbsrovgh.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrd3hoZWRkeWFncGpic3JvdmdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDM2NjEsImV4cCI6MjA5MDcxOTY2MX0.KN_JLY2owScvkGVy2inJIkEzW82_Qb2a1cavcRJFzlA";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // স্ট্যাটাস দেখানোর ফাংশন
        function showStatus(text, type) {
            const msgBox = document.getElementById('statusMessage');
            msgBox.className = `status-msg ${type}`;
            msgBox.innerHTML = type === 'success' 
                ? `<i class="fa-solid fa-circle-check"></i> ${text}`
                : `<i class="fa-solid fa-circle-exclamation"></i> ${text}`;
            msgBox.style.display = 'flex';
        }

        // লগইন প্রসেস করার ফাংশন
        async function handleEmployeeLogin(event) {
            event.preventDefault();

            const email = document.getElementById('empEmail').value.trim();
            const password = document.getElementById('empPassword').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            // লোডিং স্টেট অন করা
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Checking...`;
            document.getElementById('statusMessage').style.display = 'none';

            try {
                // ডাটাবেজের 'igi_employees' টেবিলে ইমেইল এবং পাসওয়ার্ড ম্যাচ করানো হচ্ছে
                const { data: employee, error } = await _supabase
                    .from('igi_employees')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .single(); // ১টি মাত্র ডাটা ম্যাচ করবে

                if (error || !employee) {
                    throw new Error("Wrong Email or Password! Please check again.");
                }

                // লগইন সফল হলে মেসেজ দেখানো
                showStatus("Login successful! Redirecting...", "success");

                // এমপ্লয়ির তথ্য ব্রাউজারের লোকাল স্টোরেজে সেভ রাখা (ড্যাশবোর্ডে প্রোফাইল দেখানোর জন্য)
                localStorage.setItem('current_employee', JSON.stringify(employee));

                // ১.৫ সেকেন্ড পর ড্যাশবোর্ডে রিডাইরেক্ট করা
                setTimeout(() => {
                    window.location.href = "./index.html";
                }, 1500);

            } catch (err) {
                console.error(err);
                showStatus(err.message || "Wrong Email or Password! Please check again.", "error");
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<i class="fa-solid fa-right-from-bracket"></i> Login`;
            }
        }
    </script>
</body>
</html>
