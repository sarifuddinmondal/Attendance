<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGI SYSTEM - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #1e3a8a;
            --accent: #10b981;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header i {
            font-size: 45px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
            letter-spacing: 1px;
        }

        .login-header p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 12px 12px 38px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(30, 58, 138, 0.2);
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #1e40af;
        }

        /* Error Message Style - পাসওয়ার্ড ভুল হলে এটি পপ-আপ করবে */
        .error-message {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none; /* শুরুতে হাইড থাকবে */
            align-items: center;
            gap: 10px;
            animation: shake 0.2s ease-in-out 2;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <i class="fa-solid fa-building-shield"></i>
            <h2>IGI SYSTEM</h2>
            <p>Sign in to access your dashboard</p>
        </div>

        <div id="errorMsg" class="error-message">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 16px;"></i>
            <span id="errorText">Wrong Password! Please try again.</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <div class="footer-text">
            &copy; 2026 IGI System. All Rights Reserved.
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vkwxheddyagpjbsrovgh.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrd3hoZWRkeWFncGpic3JvdmdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDM2NjEsImV4cCI6MjA5MDcxOTY2MX0.KN_JLY2owScvkGVy2inJIkEzW82_Qb2a1cavcRJFzlA";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            // নতুন করে চেষ্টা করার সময় আগের এরর মেসেজটি হাইড করা
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Checking...`;

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // পাসওয়ার্ড ঠিক থাকলে সরাসরি মূল ড্যাশবোর্ডে রিডাইরেক্ট করবে
                window.location.href = "./index.html"; 

            } catch (err) {
                // পাসওয়ার্ড বা ইমেইল ভুল হলে এখানে ক্যাচ করবে এবং লাল বক্সটি শো করবে
                let clientMessage = "Wrong Password! Please try again.";
                
                // সুপাবেসের মেসেজ চেক করা (যেমন ইউজার না পাওয়া গেলে বা নেটওয়ার্ক এরর হলে)
                if (err.message && err.message.includes("Invalid login credentials")) {
                    clientMessage = "Wrong Email or Password! Please check again.";
                } else if (err.message) {
                    clientMessage = err.message;
                }

                errorText.innerText = clientMessage;
                errorMsg.style.display = 'flex'; // লাল এরর বক্সটি দেখাবে
                
                // বাটন আগের অবস্থায় ফিরিয়ে আনা
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Login`;
            }
        }

        // অলরেডি সফলভাবে লগইন করা থাকলে পেজ রিফ্রেশ করলেও সরাসরি ড্যাশবোর্ডে চলে যাবে
        async function checkExistingSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                window.location.href = "./index.html";
            }
        }
        checkExistingSession();
    </script>
</body>
</html>
